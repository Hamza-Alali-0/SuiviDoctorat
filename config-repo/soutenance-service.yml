# soutenance-service configuration (served by Config Server)
server:
  port: 8096

spring:
  application:
    name: soutenance-service
  datasource:
    url: jdbc:mysql://localhost:3306/suividoctorat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

spring.servlet.multipart.max-file-size: 10MB
spring.servlet.multipart.max-request-size: 10MB
app:
  upload:
    dir: ./uploads/soutenance
  soutenance:
    upload-dir: ./uploads/soutenance
    publications-requises: 2
    credits-formation-requis: 30
    minimum-rapporteurs: 2
  notification:
    url: http://localhost:8094/api/notifications

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
