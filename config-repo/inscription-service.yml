# inscription-service configuration (served by Config Server)
server:
  port: 8092

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://localhost:3306/suividoctorat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: 0f8e7a9c3b2d4f6a8c9e1b2d3f4a6c7e0f8e7a9c3b2d4f6a8c9e1b2d3f4a6c7e
    expiration-ms: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
# Additional logging options can be managed here if desired
