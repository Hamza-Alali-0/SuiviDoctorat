
<nav class="navbar public">
	<div class="nav-left">
		<div class="brand">
			<a class="brand-link" [routerLink]="['/']">
				<img src="assets/logo_white.png" alt="SuiviDoctorat logo (light)" class="brand-logo brand-logo--light" />
				<img src="assets/logo.png" alt="SuiviDoctorat logo (dark)" class="brand-logo brand-logo--dark" />
			</a>
			<span class="brand-text">SuiviDoctorat</span>
		</div>

		<!-- Search Bar -->
		<div class="search-container">
			<svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
				<circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
				<path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
			</svg>
			<input type="search" placeholder="Search..." class="search-input" aria-label="Search" />
		</div>

		<!-- Navigation Links -->
		<div class="nav-links">
			<a [routerLink]="['/']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
			<a [routerLink]="['/campaigns']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" class="nav-link">Campaigns</a>
			<a [routerLink]="['/about']" routerLinkActive="active" class="nav-link">About</a>
			<a [routerLink]="['/contact']" routerLinkActive="active" class="nav-link">Contact</a>
		</div>
	</div>

	<div class="nav-right">
		<!-- Theme selector: opens a small dropdown with choices -->
		<div class="theme-wrapper" tabindex="0" role="button" aria-haspopup="listbox" [attr.aria-expanded]="themeMenuOpen()">
			<button class="icon-button" title="Change theme" aria-label="Theme selector" type="button" (click)="toggleThemeMenu(); $event.stopPropagation()">
				<ng-container *ngIf="theme() === 'dark'">
					<!-- moon -->
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
						<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</ng-container>
				<ng-container *ngIf="theme() === 'light'">
					<!-- sun -->
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
						<circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/>
						<path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
					</svg>
				</ng-container>
				<ng-container *ngIf="theme() === 'system'">
					<!-- monitor/system -->
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
						<rect x="3" y="4" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/>
						<path d="M8 20h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
					</svg>
				</ng-container>
			</button>

			<ul class="theme-menu" *ngIf="themeMenuOpen()" role="listbox" aria-label="Theme menu" (click)="$event.stopPropagation()">
				<li role="option" tabindex="0" (click)="setTheme('light')" (keydown.enter)="setTheme('light')" [attr.aria-selected]="theme() === 'light'">
					Light <span class="check" *ngIf="theme() === 'light'">✓</span>
				</li>
				<li role="option" tabindex="0" (click)="setTheme('dark')" (keydown.enter)="setTheme('dark')" [attr.aria-selected]="theme() === 'dark'">
					Dark <span class="check" *ngIf="theme() === 'dark'">✓</span>
				</li>
				<li role="option" tabindex="0" (click)="setTheme('system')" (keydown.enter)="setTheme('system')" [attr.aria-selected]="theme() === 'system'">
					System <span class="check" *ngIf="theme() === 'system'">✓</span>
				</li>
			</ul>
		</div>

		<!-- Language selector: opens a small dropdown with choices -->
		<div class="language-wrapper" tabindex="0" role="button" aria-haspopup="listbox" [attr.aria-expanded]="langMenuOpen()">
			<button class="icon-button" title="Change language" aria-label="Language selector" type="button" (click)="toggleLangMenu(); $event.stopPropagation()">
				<svg width="20" height="20" viewBox="0 0 24 24" fill="none">
					<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
					<path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" stroke="currentColor" stroke-width="2"/>
				</svg>
			</button>

			<ul class="lang-menu" *ngIf="langMenuOpen()" role="listbox" aria-label="Language menu" (click)="$event.stopPropagation()">
				<li role="option" tabindex="0" (click)="setLanguage('en')" (keydown.enter)="setLanguage('en')" [attr.aria-selected]="language() === 'en'">
					English <span class="check" *ngIf="language() === 'en'">✓</span>
				</li>
				<li role="option" tabindex="0" (click)="setLanguage('fr')" (keydown.enter)="setLanguage('fr')" [attr.aria-selected]="language() === 'fr'">
					Français <span class="check" *ngIf="language() === 'fr'">✓</span>
				</li>
				<li role="option" tabindex="0" dir="rtl" (click)="setLanguage('ar')" (keydown.enter)="setLanguage('ar')" [attr.aria-selected]="language() === 'ar'">
					العربية <span class="check" *ngIf="language() === 'ar'">✓</span>
				</li>
			</ul>
		</div>

		<!-- Sign In / Sign Up Buttons -->
		<a class="btn-signin" [routerLink]="['/auth']" [queryParams]="{ mode: 'signin' }">Sign In</a>
		<a class="btn-signup" [routerLink]="['/auth']" [queryParams]="{ mode: 'signup' }">Sign Up</a>
	</div>
</nav>

<style>
	:host { display:block; font-size:16px; box-sizing:border-box }
	.navbar.public { position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; gap:1rem; height:64px; padding:0 1.25rem; background:rgba(255,255,255,0.8); backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid rgba(0,0,0,0.06); transition:all 0.3s ease }
	:host-context(.dark) .navbar.public { background:rgba(17,24,39,0.92); border-bottom:1px solid rgba(255,255,255,0.08) }
	
	/* Left Section */
	.nav-left { display:flex; align-items:center; gap:1.5rem; flex:1 }
	.brand { display:flex; align-items:center; gap:0.6rem }
	.brand-link { display:flex; align-items:center; gap:0.5rem; text-decoration:none }
	.brand-logo { width:48px; height:48px; object-fit:contain }
	.brand-logo--light { display:block }
	.brand-logo--dark { display:none }
	.brand-text { font-weight:700; color:#0f172a; font-size:1.125rem; transition:color 0.3s ease }
	:host-context(.dark) .brand-text { color:#f9fafb }

	/* Search Bar */
	.search-container { position:relative; display:flex; align-items:center; gap:0.5rem; padding:0 1rem; background:#f3f4f6; border:1px solid #e5e7eb; border-radius:24px; width:100%; max-width:400px; height:40px; transition:all 0.3s ease }
	.search-container:focus-within { background:#fff; border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,0.1) }
	:host-context(.dark) .search-container { background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.08) }
	:host-context(.dark) .search-container:focus-within { background:rgba(255,255,255,0.06); border-color:#3b82f6 }
	.search-icon { flex-shrink:0; color:#6b7280; transition:color 0.3s ease }
	:host-context(.dark) .search-icon { color:#9ca3af }
	.search-container:focus-within .search-icon { color:#3b82f6 }
	.search-input { flex:1; border:none; background:transparent; outline:none; font-size:0.9375rem; color:#0f172a; transition:color 0.3s ease }
	:host-context(.dark) .search-input { color:#f9fafb }
	.search-input::placeholder { color:#9ca3af; transition:color 0.3s ease }
	:host-context(.dark) .search-input::placeholder { color:#6b7280 }

	/* Navigation Links */
	.nav-links { display:flex; align-items:center; gap:0.25rem }
	.nav-link { padding:0.5rem 1rem; color:#475569; text-decoration:none; font-weight:600; font-size:0.9375rem; border-radius:6px; transition:all 0.2s ease }
	.nav-link:hover { background:#f3f4f6; color:#1e40af }
	.nav-link.active { background:#eff6ff; color:#2563eb }
	:host-context(.dark) .nav-link { color:#d1d5db }
	:host-context(.dark) .nav-link:hover { background:rgba(255,255,255,0.06); color:#60a5fa }
	:host-context(.dark) .nav-link.active { background:rgba(37,99,235,0.2); color:#60a5fa }

	/* Right Section */
	.nav-right { display:flex; align-items:center; gap:0.75rem }
	.icon-button { width:40px; height:40px; display:flex; align-items:center; justify-content:center; border:none; background:transparent; color:#475569; border-radius:8px; cursor:pointer; transition:all 0.2s ease }
	.icon-button:hover { background:#f3f4f6; color:#1e40af }
	:host-context(.dark) .icon-button { color:#e6eef8 }
	:host-context(.dark) .icon-button:hover { background:rgba(255,255,255,0.04); color:#60a5fa }

	/* Sign In / Sign Up Buttons */
	.btn-signin, .btn-signup { padding:0.5rem 1.25rem; text-decoration:none; font-weight:600; font-size:0.9375rem; border-radius:6px; transition:all 0.2s ease }
	.btn-signin { color:#475569; background:transparent; border:1px solid #e5e7eb }
	.btn-signin:hover { background:#f3f4f6; border-color:#3b82f6; color:#1e40af }
	:host-context(.dark) .btn-signin { color:#e6eef8; border-color:rgba(255,255,255,0.08) }
	:host-context(.dark) .btn-signin:hover { background:rgba(255,255,255,0.04); border-color:#60a5fa; color:#60a5fa }
	.btn-signup { background:#1e40af; color:white; border:1px solid #1e40af }
	.btn-signup:hover { background:#1e3a8a; transform:translateY(-1px); box-shadow:0 4px 12px rgba(30,64,175,0.3) }
	:host-context(.dark) .btn-signup { background:#60a5fa; border-color:#60a5fa }
	:host-context(.dark) .btn-signup:hover { background:#3b82f6 }

	/* Responsive */
	@media (max-width:1024px){ 
		.search-container { max-width:250px }
		.nav-links { display:none }
	}
	@media (max-width:768px){ 
		.brand-text { display:none }
		.search-container { max-width:180px }
	}
	@media (max-width:640px){ 
		.search-container { display:none }
		.btn-signin, .btn-signup { padding:0.5rem 0.75rem; font-size:0.875rem }
	}

/* Language dropdown styles */
.language-wrapper { position:relative; display:inline-block }
.lang-menu { position:absolute; right:0; top:calc(100% + 8px); min-width:160px; background:#fff; border:1px solid rgba(15,23,42,0.06); border-radius:8px; box-shadow:0 6px 18px rgba(2,6,23,0.08); padding:6px 4px; z-index:60; list-style:none; margin:0 }
.lang-menu li { padding:8px 12px; cursor:pointer; border-radius:6px; font-size:0.9375rem; color:#0f172a; display:flex; justify-content:space-between; align-items:center }
.lang-menu li:hover, .lang-menu li:focus { background:#f3f4f6; outline:none }
.lang-menu .check { color:#2563eb; font-weight:700; margin-left:8px }

/* Theme dropdown matches language menu */
.theme-wrapper { position:relative; display:inline-block }
.theme-menu { position:absolute; right:0; top:calc(100% + 8px); min-width:160px; background:#fff; border:1px solid rgba(15,23,42,0.06); border-radius:8px; box-shadow:0 6px 18px rgba(2,6,23,0.08); padding:6px 4px; z-index:60; list-style:none; margin:0 }
.theme-menu li { padding:8px 12px; cursor:pointer; border-radius:6px; font-size:0.9375rem; color:#0f172a; display:flex; justify-content:space-between; align-items:center }
.theme-menu li:hover, .theme-menu li:focus { background:#f3f4f6; outline:none }
.theme-menu .check { color:#2563eb; font-weight:700; margin-left:8px }

:host-context(.dark) .lang-menu { background:rgba(17,24,39,0.92); border:1px solid rgba(255,255,255,0.06); color:#f8fafc }
:host-context(.dark) .lang-menu li:hover, :host-context(.dark) .lang-menu li:focus { background:rgba(255,255,255,0.03) }
:host-context(.dark) .lang-menu .check { color:#60a5fa }

:host-context(.dark) .theme-menu { background:rgba(17,24,39,0.92); border:1px solid rgba(255,255,255,0.06); color:#f8fafc }
:host-context(.dark) .theme-menu li:hover, :host-context(.dark) .theme-menu li:focus { background:rgba(255,255,255,0.03) }
:host-context(.dark) .theme-menu .check { color:#60a5fa }
</style>
