## Bootstrap import: fetch configuration from Config Server
## All service-specific properties are now stored in the central config-repo
spring.config.import=optional:configserver:http://localhost:8888
# Ensure the application name is set so the Config Server serves the matching file
spring.application.name=soutenance-service
# NOTE: local overrides were removed so the service relies on the Config Server.
# If you need to run without the Config Server, either remove the 'optional:'
# prefix or provide a local file with required properties as a fallback.
spring.application.name=soutenance-service